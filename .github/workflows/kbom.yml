name: KBOM Security Checks

on:
  push:
    branches:
      - main
      - draft
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ vars.AWS_REGION }}

      # - name: Update kube config
      #   run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: Download KBOM Artifact
        uses: actions/download-artifact@v3
        continue-on-error: true
        with:
          name: kbom

      - name: Download KBOM signature
        uses: actions/download-artifact@v3
        continue-on-error: true
        with:
          name: kbom-sign-signature

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: 'v2.4.1'
      - name: Check install!
        run: cosign version

      # - name: Download cosign
      #   env:
      #     COSIGN_EXPERIMENTAL: "1"
      #   run: |
      #     curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /usr/local/bin/cosign
      #     chmod +x /usr/local/bin/cosign

        # Ref - https://raesene.github.io/blog/2021/03/21/Trying-out-cosign/
      - name: place the cosign private key in a file
        run: 'echo "$COSIGN_PUB_KEY" > /tmp/cosign.pub'
        shell: bash
        env:
          COSIGN_PUB_KEY: ${{secrets.COSIGN_PUB_KEY}}

      - name: Verify Signature
        continue-on-error: true
        run: |
          cosign verify-blob --key /tmp/cosign.key --signature kbom.json.sig kbom.json
          # # cosign verify --key ${{ secrets.COSIGN_KEY_PATH }} kbom.json > signature_verification.txt

      - name: send notification if Signature failed
        run: |
          echo "send notification"
          exit 0

      - name: Upload Signature Verification Report
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: signature-verification-report
          path: signature_verification.txt


  generate_kbom:
    name: Generate KBOM
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Trivy Setup
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          cache: true
          version: v0.56.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: kube config list
        run: kubectl config get-contexts

      - name: Generate KBOM Artifact
        id: generate_kbom_artifact
        continue-on-error: true
        run: |
          # trivy k8s arn:aws:eks:ap-southeast-1:851725219470:cluster/${{ vars.EKS_CLUSTER_NAME }} --scanners vuln --report summary --disable-node-collector > kbom.json
          # trivy k8s --format json -o kbom.json --disable-node-collector
          trivy k8s arn:aws:eks:ap-southeast-1:851725219470:cluster/${{ vars.EKS_CLUSTER_NAME }} --scanners vuln --skip-check-update --format json -o kbom.json

      - name: Save KBOM Artifact
        if: steps.generate_kbom_artifact.outcome == 'success'
        uses: actions/upload-artifact@v3
        with:
          name: kbom
          path: kbom.json

  signature_verification:
    name: Signature Verification
    runs-on: ubuntu-latest
    needs: generate_kbom
    steps:
      - name: Download KBOM Artifact
        uses: actions/download-artifact@v3
        with:
          name: kbom

      - name: Install Cosign
        run: |
          COSIGN_VERSION=$(curl -s https://api.github.com/repos/sigstore/cosign/releases/latest | jq -r '.tag_name')
          curl -L "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

        # Ref - https://raesene.github.io/blog/2021/03/21/Trying-out-cosign/
      - name: place the cosign private key in a file
        run: 'echo "$COSIGN_KEY" > /tmp/cosign.key'
        shell: bash
        env:
          COSIGN_KEY: ${{secrets.COSIGN_KEY}}

      - name: Sign KBOM using Cosign
        continue-on-error: true
        run: |
          echo -n "${{secrets.COSIGN_KEY_PASSPHRASE}}" | /usr/local/bin/cosign sign-blob --yes --key /tmp/cosign.key kbom.json > kbom.json.sig
          # verify
          # cosign verify-blob --key ~/.ssh/cosign.pub --signature kbom.json.sig kbom.json

      - name: Upload KBOM Sign signature
        uses: actions/upload-artifact@v3
        with:
          name: kbom-sign-signature
          path: kbom.json.sig

