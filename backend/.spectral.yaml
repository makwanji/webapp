extends: 'spectral:oas'

rules:

  require-headers-field:
    description: "All APIs must include a 'headers' field in responses."
    message: "The 'headers' field is missing in this response. Add 'headers' to enforce rate limiting."
    severity: error
    given: "$.paths[*][*].responses[200,401]"
    then:
      field: "headers"
      function: truthy

  api-rate-limit-check:
    description: "All APIs must have an x-rate-limit header implemented."
    message: "The 'x-rate-limit' header is missing in this endpoint."
    severity: error
    given: "$.paths[*][*].responses[*].headers"
    then:
      field: "x-rate-limit"
      function: truthy

  operation-singular-tag:
    description: Operations must have between 1 and 3 tags.
    given: "$.paths.*"
    then:
      field: tags
      function: length
      functionOptions:
        max: 3
        min: 1

  version-format:
    description: "API version number must follow the x.x.x format."
    message: "Version number must follow the x.x.x format."
    given: "$.info.version"
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^[0-9]+\\.[0-9]+\\.[0-9]+$"

  kebab-case-paths:
    description: "API endpoint naming SHOULD follow kebab-case."
    message: "API endpoint '{{value}}' should be in kebab-case (e.g., '/example-path')."
    # given: "$.paths[*]~"
    given: "$.paths[*]~"
    severity: "warn"
    then:
      function: pattern
      functionOptions:
        match: "^(/|[a-z0-9-.]+|{[a-zA-Z0-9_]+})+$"

  uri-max-length:
    description: "URIs should not exceed the specified maximum length"
    message: "414-URI Too Long ."
    given: "$.paths[*]~"
    severity: error
    then:
      function: length
      functionOptions:
        max: 100

  must-use-forward-slash:
    description: "URIs MUST use forward slashes (/) to indicate hierarchical relationships."
    message: "URI should contain forward slashes (/) to represent hierarchy."
    given: "$.paths[*]~"
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^/.*?/.*"
